# Local development stack (OR-004, OR-007). DEVELOPMENT ONLY: this file is never used in production.
# Nothing here migrates or seeds the database: that is an explicit, separate step (SC-22, SC-33).
services:
  postgres:
    # Pinned to a specific tag (multi-arch, runs on Apple Silicon) so every machine uses the same server.
    image: postgres:18.1
    environment:
      POSTGRES_DB: orderrouter
      POSTGRES_USER: orderrouter
      # Dev-only default; this file is never used in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderrouter-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderrouter -d orderrouter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        # The API exits at startup if PostgreSQL is unreachable, so wait until it is accepting connections.
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides appsettings.Development.json: inside the compose network the host is "postgres", not localhost.
      ConnectionStrings__OrderRouter: Host=postgres;Port=5432;Database=orderrouter;Username=orderrouter;Password=${POSTGRES_PASSWORD:-orderrouter-dev-only}
      # Dev-only placeholder for the X-Api-Key header (OR-008). Ignored outside Development.
      Authentication__DevApiKey: ${DEV_API_KEY:-}
      # HMAC key for the caller hash (OR-027). No default on purpose: copy .env.example to .env, or the API refuses to start.
      CallerHashing__Secret: ${CALLER_HASHING_SECRET:-}
      # File-change events do not reliably reach a container through a bind mount, so poll for experiments.json edits (OR-016, ADR-0005).
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      # Edit this file on the host to change experiments without a restart or a deploy (SC-25).
      # Single-file mounts follow the file's inode: edit it IN PLACE (open and overwrite it). A save that replaces the
      # file (sed -i, or an editor that writes a temp file and renames it) detaches the mount until the container restarts.
      - ./src/OrderRouter.Api/experiments.json:/app/experiments.json:ro

volumes:
  postgres-data:
